/* Layout: floating pill nav over a single column; 3-up grid of floating square tiles; sheets slide up for editing. */
:root{
  --bg:#E7E9ED; --surface:#F7F8FA; --ink:#13161B; --ink2:#525A66; --line:rgba(19,22,27,.12);
  --well:#F2F3F5; --on-well:#13161B;
  --accent:#2744E8; --accent-ink:#FFFFFF; --danger:#C4352B;
  --shadow:0 1px 2px rgba(19,22,27,.06),0 12px 24px -10px rgba(19,22,27,.22);
  --shadow-pill:0 1px 2px rgba(19,22,27,.08),0 14px 30px -10px rgba(19,22,27,.32);
  --f-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1115; --surface:#171B21; --ink:#EDEFF3; --ink2:#99A1AD; --line:rgba(237,239,243,.13);
    --well:#E4E6EA; --on-well:#13161B;
    --accent:#8196FF; --accent-ink:#0A0E1F; --danger:#FF7A6E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 26px -10px rgba(0,0,0,.65);
    --shadow-pill:0 1px 2px rgba(0,0,0,.5),0 16px 34px -10px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --ink:#EDEFF3; --ink2:#99A1AD; --line:rgba(237,239,243,.13);
  --well:#E4E6EA; --on-well:#13161B;
  --accent:#8196FF; --accent-ink:#0A0E1F; --danger:#FF7A6E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 26px -10px rgba(0,0,0,.65);
  --shadow-pill:0 1px 2px rgba(0,0,0,.5),0 16px 34px -10px rgba(0,0,0,.75);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 0.9375rem/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
svg{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin-inline:auto}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* nav pill */
:root{--navh:84px;--tz:1}
html{font-size:calc(16px*var(--tz));-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
#scroll{padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + var(--navh) + 100px)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;justify-content:center;pointer-events:none;z-index:30;transform:translateZ(0)}
.nav::before{content:"";position:absolute;left:0;right:0;bottom:0;top:-18px;background:linear-gradient(to top,var(--bg) 62%,color-mix(in srgb,var(--bg) 0%,transparent));pointer-events:none;z-index:-1}
.navbar{pointer-events:auto;display:flex;align-items:center;gap:10px;transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.nav.compact .navbar{transform:scale(.9)}
.pill,.circ{background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:var(--shadow-pill);border:1px solid var(--line)}
.pill{display:flex;gap:4px;padding:6px;border-radius:999px}
.pill button{border:0;background:transparent;color:var(--ink);font:600 clamp(14px,3.8vw,16px) var(--f-body);padding:clamp(12px,3vw,16px) clamp(10px,3.2vw,26px);border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.pill button[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.circ{flex:none;width:clamp(46px,12.5vw,58px);height:clamp(46px,12.5vw,58px);border-radius:50%;display:grid;place-items:center;color:var(--ink);cursor:pointer;padding:0}

/* headings */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand-f{font:800 0.6875rem var(--f-display);font-stretch:118%;text-transform:uppercase;letter-spacing:.2em}
.brand{font:800 0.75rem/1 var(--f-display);font-stretch:118%;text-transform:uppercase;letter-spacing:.24em;color:var(--ink2);margin:0 0 8px}
.h1{font:800 1.625rem/1 var(--f-display);font-stretch:118%;text-transform:uppercase;letter-spacing:.005em;margin:0 0 6px}
.sub{font:400 0.75rem/1.3 var(--f-mono);color:var(--ink2);letter-spacing:.02em}
.grp{margin-top:26px}
.grp-h,.panel h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 12px}
.grp-h h2,.panel h2{font:700 0.9375rem var(--f-display);font-stretch:115%;text-transform:uppercase;letter-spacing:.04em;margin:0}
.foot{margin-top:28px;text-align:center}
.fb-l{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.gs-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.gs-h h2{margin:0}
.gs-r{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.gs-n{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);font:600 0.8125rem var(--f-body);color:var(--ink2)}
.gs-r.done .gs-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gs-r.done .gs-t b{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1px}
.gs-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.gs-t b{font:600 0.875rem var(--f-body)}.gs-t i{font:400 0.8125rem/1.35 var(--f-body);font-style:normal;color:var(--ink2)}
.gs-b{min-height:40px;padding:9px 14px;flex:none}
.share-row{margin-top:14px}

/* controls */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;margin-bottom:12px;color:var(--ink2)}
.search:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 1rem var(--f-body);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar,.days::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 0.8125rem var(--f-body);padding:11px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.chip i{font:500 0.75rem var(--f-mono);font-style:normal;opacity:.6;margin-left:7px}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--ink) 8%,transparent)}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--ink2);font:600 0.8125rem var(--f-body);padding:10px 8px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg i{font:500 0.75rem var(--f-mono);font-style:normal;margin-left:6px;opacity:.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:12px 18px;border-radius:14px;border:1px solid transparent;font:600 0.875rem var(--f-body);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--line);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.rb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.link{background:none;border:0;color:var(--ink2);font:500 0.8125rem var(--f-body);padding:13px 0;text-decoration:underline;cursor:pointer;text-align:left}
.rail{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding:6px 16px 22px;margin-bottom:-10px;scroll-snap-type:x proximity;scroll-padding-inline:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 clamp(104px,29vw,150px);width:auto;scroll-snap-align:start}
.seeall{font:500 0.75rem var(--f-mono);letter-spacing:.04em;color:var(--accent);text-decoration:none;padding:13px 0}
#grid>.grp:first-child{margin-top:6px}
.seg.wrap{flex-wrap:wrap}
.seg.wrap button{flex:1 1 calc(33.33% - 4px)}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 12px}
.card{display:block;width:100%;min-width:0;padding:0;border:0;background:none;text-align:left;cursor:pointer}
.tile{position:relative;isolation:isolate;aspect-ratio:1;border-radius:20px;background:var(--well);box-shadow:var(--shadow);overflow:hidden;display:grid;place-items:center;transition:transform .2s,box-shadow .2s}
.card:active .tile{transform:scale(.96)}
.tile img,.thumb img,.hero img{display:block;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.tile img{padding:7%}
.ph{display:grid;place-items:center;width:100%;height:100%;background:color-mix(in srgb,var(--c) 24%,var(--well));color:color-mix(in srgb,var(--c) 78%,#1a1d22)}
.ph{position:relative}
.ph>svg{width:44%;height:auto}
.cam{position:absolute;right:8px;bottom:8px;width:28px;height:28px;border-radius:50%;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 3px rgba(19,22,27,.2);font-style:normal}
.cam svg{width:15px;height:15px}
.thumb .cam,.hero .cam,#pv .cam{display:none}
.card{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.card img{pointer-events:none;-webkit-user-drag:none}
.brand{display:block;margin-top:10px;font:500 0.7188rem/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{display:-webkit-box;margin-top:3px;font:600 0.7812rem/1.25 var(--f-body);-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fv{position:absolute;top:8px;left:8px;z-index:2;width:22px;height:22px;display:grid;place-items:center;color:var(--accent);pointer-events:none}.fv svg{width:16px;height:16px;fill:currentColor}
.fvx[aria-pressed="true"]{color:var(--accent)}.fvx[aria-pressed="true"] svg{fill:currentColor}.sh-fx{display:flex;gap:8px;align-items:center}
.wall{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}@media (min-width:700px){.wall{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}.wl{display:block;padding:0;border:0;background:none;cursor:pointer;color:inherit}.wl .tile{border-radius:22px}.wall-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}.chip svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}.chip[aria-pressed="true"] svg{fill:currentColor}
.check{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transform:scale(0);transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.check svg{width:14px;height:14px}
.card[aria-pressed="true"] .tile{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.card[aria-pressed="true"] .check{transform:scale(1)}
.tile.add{background:transparent;box-shadow:none;border:1.5px dashed color-mix(in srgb,var(--ink) 28%,transparent);color:var(--ink2)}
.tile.add svg{width:26px;height:26px}
.skel{aspect-ratio:1;border-radius:20px;background:color-mix(in srgb,var(--ink) 8%,transparent);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.panel{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-top:16px}
.panel p{margin:0 0 14px;color:var(--ink2)}
.panel.empty{padding:22px}
.panel.empty h2{margin-bottom:10px}
.empty-note{text-align:center;color:var(--ink2);padding:44px 0}

/* log */
.days{position:relative;display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:4px 16px 14px;scrollbar-width:none}
.day{flex:none;width:54px;padding:9px 0 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:center;cursor:pointer}
.day .w{display:block;font:500 0.75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.day .n{display:block;margin-top:2px;font:700 1.125rem var(--f-display);font-stretch:112%;font-variant-numeric:tabular-nums}
.day .dot{display:block;width:6px;height:6px;border-radius:50%;margin:6px auto 0;border:1.5px solid transparent}
.day.has .dot{background:var(--accent);border-color:var(--accent)}
.day.planned .dot{border-color:var(--accent)}
.day.today .n{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.day[aria-pressed="true"] .w{color:inherit;opacity:.7}
.day[aria-pressed="true"].has .dot{background:var(--bg);border-color:var(--bg)}
.day[aria-pressed="true"].planned .dot{border-color:var(--bg)}
.stack{display:grid;gap:12px;margin-bottom:12px}
.cap{font:500 0.75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px;display:block}
.hint{font:400 0.8125rem/1.4 var(--f-body);color:var(--ink2);margin:0}
.tray{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + var(--navh));display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:22px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -6px 24px rgba(0,0,0,.22);z-index:10;transition:background .3s}
.tray.ok{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.sv{display:inline-flex;align-items:center;gap:5px;justify-content:flex-end;font:500 0.75rem var(--f-body);color:var(--ink2)}
.sv svg{width:14px;height:14px}
.tray.ok .sv,.sv.done{color:var(--ink);font-weight:700}
.tray .thumbs{max-width:calc(100% - 120px)}
.thumbs{display:flex;gap:6px;flex:1;min-width:0;overflow:hidden;align-items:center;min-height:38px}
.thumb{display:grid;place-items:center;isolation:isolate;width:38px;height:38px;flex:none;border-radius:11px;background:var(--well);overflow:hidden}
.thumb.lg{width:48px;height:48px;border-radius:13px}
.tray-r{display:grid;gap:2px;text-align:right;flex:none}

/* calendar */
.mnav{display:flex;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font:500 0.75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding-bottom:4px}
.cell{aspect-ratio:1/1.15;min-width:0;display:flex;flex-direction:column;gap:3px;padding:5px;border:0;border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(19,22,27,.06);text-align:left;color:var(--ink);cursor:pointer;overflow:hidden}
.cell.out{background:transparent;box-shadow:none;cursor:default}
.cell .n{font:500 0.75rem/1 var(--f-mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.cell.today .n{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.cell.planned{outline:1.5px dashed var(--accent);outline-offset:-2px}
.hero{position:relative;isolation:isolate;display:block;flex:1;min-height:0;border-radius:7px;background:var(--well);overflow:hidden}
.hero.none{background:transparent}
.hero .ph svg{width:60%}
.hero b{position:absolute;right:3px;bottom:2px;font:500 0.6875rem/1 var(--f-mono);color:var(--on-well)}
.bar{display:block;flex:1;height:3px;border-radius:2px}
.bars{display:flex;gap:2px;flex:none}
.t-work{background:var(--ink)}
.t-casual{background:var(--accent)}
.t-mixed{background:linear-gradient(90deg,var(--ink) 50%,var(--accent) 50%)}
.t-none{background:var(--line)}
.t-out{background:var(--accent2,#C8102E)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font:500 0.75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px 8px}
.nums b{display:block;font:800 1.75rem/1 var(--f-display);font-stretch:112%;font-variant-numeric:tabular-nums;margin-bottom:6px}
.nums span{font:500 0.75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.ri{display:flex;align-items:center;gap:12px;padding:9px 0}
.ri+.ri{border-top:1px solid var(--line)}

let dbP=null;
function idb(){
  if(dbP)return dbP;
  dbP=new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('no idb'));return}
    const r=indexedDB.open('rotation',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{r.result.onversionchange=()=>{r.result.close();dbP=null};res(r.result)};
    r.onerror=()=>rej(r.error);
  });
  dbP.catch(()=>{dbP=null});
  return dbP;
}
async function idbGet(k){
  const db=await idb();

}
async function idbSet(k,v){

}

  const C=window.Capacitor,app=(C&&C.isNativePlatform&&C.isNativePlatform())||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;

const fmtDT=t=>t?new Date(t).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
async function exportData(){
  const name='rotation-backup-'+today()+'.json',at=Date.now(),dev=devLabel();
  const blob=new Blob([JSON.stringify({app:'rotation',v:2,exportedAt:at,device:dev,items:S.items,days:S.days,looks:S.looks,settings:Object.assign({},SET)})],{type:'application/json'});
  const done=()=>{SET.lastBackup=Date.now();SET.lastExp={t:at,dev:dev};SET.newest=Math.max(SET.newest||0,at);saveSet();if(S.tab==='closet'||S.tab==='settings')render()};
  /* inside the iOS app a download link does nothing, so write the file and open the share sheet (Save to Files, AirDrop, Mail) */
  const C=window.Capacitor,P=C&&C.Plugins;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&P&&P.Filesystem&&P.Share){
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
      const w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
      await P.Share.share({title:'Rotation backup',url:w.uri});
      done();return;
    }catch(e){if(e&&/cancel/i.test(String(e.message||e)))return}
  }
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});done();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  done();
}
async function importData(file){

  const addD=[],diffD=[];
  Object.keys(j.days||{}).forEach(k=>{const nd=normDay(j.days[k]),ex=S.days[k];if(!dayHas(ex))addD.push([k,nd]);else if(!same(normDay(JSON.parse(JSON.stringify(ex))),nd))diffD.push([k,nd])});
  const addL=(Array.isArray(j.looks)?j.looks:[]).filter(l=>l&&l.id&&Array.isArray(l.items)&&!S.looks.some(x=>x.id===l.id));
  let useBackup=false;
  if(diffI.length||diffD.length){
    const bits=[];if(diffI.length)bits.push(diffI.length+' piece'+(diffI.length===1?'':'s'));if(diffD.length)bits.push(diffD.length+' logged day'+(diffD.length===1?'':'s'));

    S.items.sort((a,b)=>a.id<b.id?-1:1);

      const o=j.settings;

      if(o.subs&&typeof o.subs==='object')SET.subs=o.subs;
      if(Array.isArray(o.occ))SET.occ=o.occ.filter(x=>x&&x.id&&x.label).slice(0,4);

}

  if(c===0)return 'Clear';if(c<=2)return 'Partly cloudy';if(c===3)return 'Cloudy';if(c===45||c===48)return 'Fog';
  if(c>=51&&c<=57)return 'Drizzle';if((c>=61&&c<=67)||(c>=80&&c<=82))return 'Rain';if((c>=71&&c<=77)||c===85||c===86)return 'Snow';if(c>=95)return 'Storms';return 'Cloudy';
}
function wxHTML(){
  if(!WXS.lat)return '<button type="button" class="wxc" data-act="wx-set"><span>Add weather</span></button>';
  const d=WXS.d;
  if(!d)return '<button type="button" class="wxc" data-act="wx-set"><span>'+esc(WXS.n||'Weather')+'</span></button>';
  return '<button type="button" class="wxc" data-act="wx-set" aria-label="Weather in '+esc(WXS.n)+'. Tap to change city."><b>'+Math.round(d.t)+'\u00b0</b><span>'+esc(wxWord(d.c))+(d.p>=40?' \u00b7 '+d.p+'% rain':'')+'</span><i>H '+Math.round(d.h)+' \u00b7 L '+Math.round(d.l)+' \u00b7 '+esc(WXS.n)+'</i></button>';
}
function wxPaint(){const e=$('#wxbox');if(e)e.innerHTML=wxHTML()}
async function wxLoad(force){
  if(!WXS.lat)return;
  if(!force&&WXS.d&&Date.now()-(WXS.at||0)<30*60*1000)return;
  if(WXS.gps&&!force&&navigator.permissions&&navigator.permissions.query){
    try{const st=await navigator.permissions.query({name:'geolocation'});
      if(st.state==='granted'){const c=await wxGps(),lat=Math.round(c.latitude*100)/100,lon=Math.round(c.longitude*100)/100;
        if(Math.abs(lat-WXS.lat)>0.15||Math.abs(lon-WXS.lon)>0.15){WXS.n=await wxName(lat,lon)}
        WXS.lat=lat;WXS.lon=lon}}catch(e){}
  }
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+WXS.lat+'&longitude='+WXS.lon+'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=1');
    const j=await r.json();
    WXS.d={t:j.current.temperature_2m,c:j.current.weather_code,h:j.daily.temperature_2m_max[0],l:j.daily.temperature_2m_min[0],p:j.daily.precipitation_probability_max[0]||0};
    WXS.at=Date.now();wxSave();wxPaint();
  }catch(e){/* offline: keep the last reading */}
}
function wxGps(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('nogeo'));navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(e),{enableHighAccuracy:false,timeout:10000,maximumAge:600000})})}
async function wxName(lat,lon){
  try{const r=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=en');const j=await r.json();return j.city||j.locality||j.principalSubdivision||'Near you'}catch(e){return 'Near you'}
}
async function wxUseGps(){
  try{
    const c=await wxGps(),lat=Math.round(c.latitude*100)/100,lon=Math.round(c.longitude*100)/100;
    const n=await wxName(lat,lon);WXS={n:n,lat:lat,lon:lon,gps:1};wxSave();wxPaint();wxLoad(true);return true;
  }catch(e){toast(e&&e.code===1?'Location is off for Rotation. Type a city instead.':'Could not get your location. Type a city instead.');return false}
}
async function wxCity(){
  const r0=await ask({title:'City for the weather',input:{placeholder:'Greenville',value:WXS.gps?'':(WXS.n||''),label:'City'},actions:[{label:'Find city',kind:'primary'},{label:'Cancel'}]});
  if(!r0||r0.i!==0||!r0.val.trim())return;
  const v=r0.val;
  try{
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=en&name='+encodeURIComponent(v.trim().split(',')[0]));
    const j=await r.json(),rs=(j.results||[]).slice(0,5);
    if(!rs.length){toast('Could not find that city. Check the spelling.');return}
    let g=rs[0];
    if(rs.length>1){
      const lab=x=>x.name+', '+(x.admin1?x.admin1+', ':'')+(x.country_code||'');
      const a=await ask({title:'Which one?',actions:rs.map((x,k)=>({label:lab(x),kind:k===0?'primary':'ghost'})).concat([{label:'Cancel'}])});
      if(!a||a.i>=rs.length)return;g=rs[a.i];
    }
    WXS={n:g.name,lat:g.latitude,lon:g.longitude};wxSave();wxPaint();wxLoad(true);
  }catch(e){toast('Could not look that up. Check your connection and try again.')}
}
async function wxSet(){
  if(!WXS.lat){if(await wxUseGps())return;return wxCity()}
  const r=await ask({title:'Weather location',body:'Use where you are right now, or pick a city.',actions:[{label:'Use my location',kind:'primary'},{label:'Type a city'},{label:'Cancel'}]});
  if(!r||r.i===2)return;
  if(r.i===0){if(await wxUseGps())return}
  wxCity();
}

/* ---------- log ---------- */
function target(create){
  let d=S.days[S.sel];
  if(!d){if(!create)return {items:[],tag:''};d=S.days[S.sel]=normDay({})}
  if(S.mode==='plan')return d.plans[S.opt];
  if(S.out>0){if(!d.more[S.out-1]){if(!create)return {items:[],tag:''};while(d.more.length<S.out)d.more.push({items:[],tag:''})}return d.more[S.out-1]}
  return d;
}
function defaultMode(d){
  const t=today();
  if(d>t)return 'plan';
  if(d===t){const dd=S.days[d];if(dd&&!outfitsOf(dd).length&&dd.plans.some(p=>p.items.length))return 'plan'}
  return 'log';
}
function tagSeg(){
  const t=target(false);
  return TAGS.map(x=>'<button type="button" data-act="tag" data-v="'+x.id+'" aria-pressed="'+thas(t.tag,x.id)+'">'+x.label+'</button>').join('');
}
function stripDates(){
  const t=today();
  let from=addDays(t,-21),to=addDays(t,10);
  if(S.sel<from)from=addDays(S.sel,-7);
  if(S.sel>to)to=addDays(S.sel,7);
  const out=[];
  for(let d=from;d<=to;d=addDays(d,1))out.push(d);
  return out;
}

  const y=S.days[addDays(sel,-1)];

/* ---------- queued outfits: future outfits wait, locked plans become worn on the day ---------- */
function settleDays(){
  const t=today();let n=0;
  Object.keys(S.days).forEach(k=>{
    const d=S.days[k];if(!d)return;
    let ch=false;
    if(k>t){
      const moves=[];
      if(d.items.length)moves.push({items:d.items,tag:d.tag,when:d.when});
      d.more.forEach(o=>{if(o.items.length)moves.push({items:o.items,tag:o.tag,when:o.when})});
      if(moves.length){
        const free=d.plans.map((p,i)=>p.items.length?-1:i).filter(i=>i>=0);
        if(free.length>=moves.length){
          moves.forEach((m,j)=>{d.plans[free[j]]={items:m.items.slice(),tag:m.tag||'',when:m.when||'',locked:true}});
          d.items=[];d.tag='';d.when='';d.photo='';d.rating=0;d.more=[];ch=true;
        }
      }
    }else{
      const lk=d.plans.map((p,i)=>({p:p,i:i})).filter(x=>x.p.locked&&x.p.items.length);
      if(lk.length){
        lk.forEach(x=>{
          const w=x.p.when||'';
          if(!d.items.length){d.items=x.p.items.slice();d.tag=x.p.tag||'';d.when=w}
          else d.more.push({items:x.p.items.slice(),tag:x.p.tag||'',place:x.p.place||'',wx:x.p.wx||'',note:x.p.note||'',when:w,photo:'',rating:0});
          d.plans=d.plans.map((q,i)=>(i===x.i||wov(q.when,w))?{items:[],tag:'',when:'',locked:false}:q);
        });
        ch=true;
      }
    }
    if(ch){n++;scheduleDay(k)}
  });
  return n;
}

/* ---------- streak, insight, recap ---------- */
const hasFit=k=>{const d=S.days[k];return !!d&&outfitsOf(d).some(o=>o.items.some(id=>M.has(id)))};
const hasLog=k=>hasFit(k)||!!(S.days[k]&&S.days[k].rest);
function streakInfo(){
  const t=today(),ks=Object.keys(S.days).filter(k=>k<=t&&hasLog(k)).sort();
  if(!ks.length)return {cur:0,best:0,risk:false,done:false,saved:false};
  const end=hasLog(t)?t:addDays(t,-1);
  let d=ks[0],run=0,best=0,lf=null,saved=false,risk=false,g=0;
  while(d<=end&&g++<4000){
    if(hasLog(d)){run++;if(run>best)best=run}
    else{
      const canF=hasLog(addDays(d,-1))&&(lf===null||daysSince(lf)-daysSince(d)>=7);
      if(canF&&hasLog(addDays(d,1))&&addDays(d,1)<=end){lf=d;if(daysSince(d)<=7)saved=true}
      else if(canF&&d===end&&d<t)risk=true;
      else run=0;
    }
    d=addDays(d,1);
  }
  return {cur:run,best:best,risk:risk,done:hasLog(t),saved:saved};
}
function streakChip(){
  const s=streakInfo();if(s.cur<2)return '';
  return '<button type="button" class="chip stk'+(s.risk?' risk':'')+'" data-act="tab" data-tab="stats" aria-label="'+s.cur+' day streak">'+s.cur+'-day<span class="sl"> streak</span>'+(s.risk?'<span class="sl"> · log today</span>':'')+'</button>';
}

  if(top&&wm[top]>=3)c.push(piece(M.get(top),dn(M.get(top))+' is your most worn this month, '+wm[top]+' times.'));
  const pieces=S.items.filter(i=>i.category!=='scents'),usedM=pieces.filter(i=>wm[i.id]>0).length;
  if(pieces.length>=8&&usedM>0)c.push({i:null,t:'You’ve worn '+usedM+' of your '+pieces.length+' pieces this month.'});
  const never=pieces.filter(i=>!st.wears[i.id]);
  if(never.length>=3){const n=never[0];c.push(piece(n,never.length+' pieces haven’t been worn yet, like '+dn(n)+'.'))}
  const sk=streakInfo();if(sk.best>=7)c.push({i:null,t:'Your best streak is '+sk.best+' days. Current: '+sk.cur+'.'});
  if(!c.length)return '';
  const n=Math.floor(parse(t)/864e5),p=c[n%c.length];

}

    case 'view-wear':{
      /* from the closet: jump to today's Log with the piece already in the outfit. Already on Log: stay put. */
      const id2=S.vw,y=window.scrollY,fromLog=S.tab==='log';closeView();
      if(!fromLog){S.sel=today();S.mode='log';S.out=0;S.tab='log'}
      toggleOutfit(id2,true);
      if(fromLog)keepY(y);else{render();toTop()}
      toast('Added to '+(S.sel===today()?'today':fmt(S.sel,{month:'short',day:'numeric'})));break}
    case 'occ-add':{const i=$('#f-occ'),v=i&&i.value.trim();if(!v)break;if(SET.occ.length>=4)break;if(BASE_TAGS.concat(SET.occ).some(t=>t.label.toLowerCase()===v.toLowerCase())){toast('You already have that one');break}SET.occ.push({id:'c'+Date.now().toString(36),label:v});saveSet();buildTags();render();break}
    case 'occ-del':SET.occ=SET.occ.filter(o=>o.id!==id);saveSet();buildTags();render();break;
    case 'photo-adjust':adjustPhoto(el.dataset.slot||'f');break;
    case 'crop-remove':{const sl=S.slot||'f';closeCrop();clearPhoto(sl);toast('Photo removed. Tap Save to keep the change.');break}
    case 'pv-tap':adjustPhoto('f');break;
    case 'pv-tap2':if(S.sheet&&(S.sheet.draft.previewUrl2||S.sheet.draft.photo2))adjustPhoto('b');else{const f2=$('#f-file2');if(f2)f2.click()}break;
    case 'crop-reset':cropReset();break;
    case 'crop-fit':centerPiece();break;
    case 'crop-clean':toggleClean();break;
    case 'crop-cancel':closeCrop();break;
    case 'crop-done':cropDone();break;
    case 'photo-clear':clearPhoto(el.dataset.slot||'f');toast('Photo removed. Tap Save to keep the change.');break;
    case 's-save':saveItem();break;
    case 's-del':delClick();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.qn!==undefined&&QA&&QA.rows[+t.dataset.qn])QA.rows[+t.dataset.qn].name=t.value;
  if(t.dataset&&t.dataset.f&&S.sheet)S.sheet.draft[t.dataset.f]=t.value;
  if(t.id==='q'){S.q=t.value;fillGrid()}
  if(t.dataset&&t.dataset.act==='share-caption'&&SH){SH.caption=t.value;buildShare()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-qa'){qaFiles(e.target.files);e.target.value=''}
  if(e.target.id==='f-file'){const f=e.target.files&&e.target.files[0];if(f)onFile(f,'f');e.target.value=''}
  if(e.target.id==='f-file2'){const f=e.target.files&&e.target.files[0];if(f)onFile(f,'b');e.target.value=''}
  if(e.target.id==='f-shoe'){const f=e.target.files&&e.target.files[0];if(f)onShoeFile(f);e.target.value=''}
  if(e.target.id==='f-look'){const f=e.target.files&&e.target.files[0];if(f)onLookFile(f);e.target.value=''}
  if(e.target.id==='f-fit'||e.target.id==='f-fitl'){const f=e.target.files&&e.target.files[0];if(f)onFit(f);e.target.value=''}
  if(e.target.id==='f-import'){const f=e.target.files&&e.target.files[0];if(f)importData(f);e.target.value=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ASK)closeAsk(-1);else if(SH)closeShare();else if(CR)closeCrop();else if(S.arr){S.arr=false;renderArrange();render()}else if(S.vw)closeView();else if(S.sheet)closeSheet();else if(S.dv)closeDay()}});

let scrollT;
window.addEventListener('scroll',()=>{
  const n=$('#nav');n.classList.add('compact');
  clearTimeout(scrollT);scrollT=setTimeout(()=>n.classList.remove('compact'),240);
},{passive:true});

applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(SET.theme==='auto')applyTheme()})}catch(e){}
(function(){const sp=document.getElementById('splash');if(!sp)return;if(SET.splash){setTimeout(()=>sp.remove(),3300);sp.addEventListener('click',()=>sp.remove())}else sp.remove()})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.loading&&settleDays())render()});
init();
})();
</script>

</body></html>
